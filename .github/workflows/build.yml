# One-time source migration, then normal firmware build.
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply layered map pipeline migration
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          header = Path('include/services/map_background.h')
          text = header.read_text()
          old = '''/**
           * Download and draw a light static map into the supplied 320x320 sprite.
           * Returns false without modifying the sprite when maps are disabled or the
           * request/decoder fails, allowing the normal solid radar background fallback.
           */
          bool draw(LGFX_Sprite& target, double lat, double lon, float outer_radius_km);
          '''
          new = '''/** True when the requested map view is not fully cached. */
          bool needsPrepare(double lat, double lon, float outer_radius_km);

          /** Download/cache the requested map view without requiring a frame sprite. */
          bool prepare(double lat, double lon, float outer_radius_km);

          /** Draw only an already-cached map into the supplied 320x320 sprite. */
          bool drawCached(LGFX_Sprite& target, double lat, double lon,
                          float outer_radius_km);

          /** Compatibility wrapper: prepare and then draw the cached map. */
          bool draw(LGFX_Sprite& target, double lat, double lon, float outer_radius_km);
          '''
          if old in text:
              text = text.replace(old, new)
          elif 'bool needsPrepare(' not in text:
              raise SystemExit('map header anchor not found')
          header.write_text(text)

          source = Path('src/services/map_background.cpp')
          text = source.read_text()
          text = re.sub(
              r'\nbool recreateTarget\(LGFX_Sprite& target\) \{.*?\n\}\n\n',
              '\n', text, flags=re.S)

          old_draw = '''bool draw(LGFX_Sprite& target, double lat, double lon, float outer_radius_km) {
            init();
            if (!configured()) return false;

            const unsigned long now = millis();
            if (s_next_retry_ms && static_cast<long>(now - s_next_retry_ms) < 0) {
              return false;
            }

            const TileView view = tileViewFor(lat, lon, outer_radius_km);
            if (!allTilesCached(view)) {
              target.deleteSprite();
              Serial.printf("map: released radar sprite; heap %u largest %u\\n",
                            ESP.getFreeHeap(), ESP.getMaxAllocHeap());

              const bool downloaded = ensureTiles(view);
              const bool recreated = recreateTarget(target);
              if (!downloaded || !recreated) {
                s_next_retry_ms = now + kRetryDelayMs;
                return false;
              }
            }

            if (!drawTiles(target, view)) {
              s_next_retry_ms = now + kRetryDelayMs;
              return false;
            }
            return true;
          }
          '''
          new_draw = '''bool needsPrepare(double lat, double lon, float outer_radius_km) {
            init();
            if (!configured()) return false;
            return !allTilesCached(tileViewFor(lat, lon, outer_radius_km));
          }

          bool prepare(double lat, double lon, float outer_radius_km) {
            init();
            if (!configured()) return false;

            const unsigned long now = millis();
            if (s_next_retry_ms && static_cast<long>(now - s_next_retry_ms) < 0) {
              return false;
            }

            const TileView view = tileViewFor(lat, lon, outer_radius_km);
            if (allTilesCached(view)) return true;

            Serial.printf("map: preparing tiles; heap %u largest %u\\n",
                          ESP.getFreeHeap(), ESP.getMaxAllocHeap());
            if (!ensureTiles(view)) {
              s_next_retry_ms = now + kRetryDelayMs;
              return false;
            }
            return true;
          }

          bool drawCached(LGFX_Sprite& target, double lat, double lon,
                          float outer_radius_km) {
            init();
            if (!configured()) return false;

            const TileView view = tileViewFor(lat, lon, outer_radius_km);
            if (!allTilesCached(view)) return false;
            if (!drawTiles(target, view)) {
              s_next_retry_ms = millis() + kRetryDelayMs;
              return false;
            }
            return true;
          }

          bool draw(LGFX_Sprite& target, double lat, double lon,
                    float outer_radius_km) {
            return prepare(lat, lon, outer_radius_km) &&
                   drawCached(target, lat, lon, outer_radius_km);
          }
          '''
          if old_draw in text:
              text = text.replace(old_draw, new_draw)
          elif 'bool needsPrepare(' not in text:
              raise SystemExit('map draw anchor not found')
          source.write_text(text)

          radar = Path('src/ui/radar_display.cpp')
          text = radar.read_text()
          old_render = '''void renderFrame() {
            const bool map_ready = services::map_background::draw(
                s_frame, services::location::lat(), services::location::lon(),
                radar::rangeCurrent().outer_km);
          '''
          new_render = '''bool prepareMapForFrame() {
            const double lat = services::location::lat();
            const double lon = services::location::lon();
            const float range_km = radar::rangeCurrent().outer_km;

            if (!services::map_background::needsPrepare(lat, lon, range_km)) {
              return true;
            }

            if (s_frame_ready) {
              s_frame.deleteSprite();
              s_frame_ready = false;
            }
            return services::map_background::prepare(lat, lon, range_km);
          }

          void renderFrame() {
            const bool map_ready = services::map_background::drawCached(
                s_frame, services::location::lat(), services::location::lon(),
                radar::rangeCurrent().outer_km);
          '''
          if old_render in text:
              text = text.replace(old_render, new_render)
          elif 'bool prepareMapForFrame()' not in text:
              raise SystemExit('radar render anchor not found')

          old_draw_entry = '''void radarDisplayDraw() {
            initPalette();
            initLabelMetrics();

            if (ensureFrameSprite()) {
          '''
          new_draw_entry = '''void radarDisplayDraw() {
            initPalette();
            initLabelMetrics();
            prepareMapForFrame();

            if (ensureFrameSprite()) {
          '''
          if old_draw_entry in text:
              text = text.replace(old_draw_entry, new_draw_entry)
          elif 'initLabelMetrics();\n  prepareMapForFrame();' not in text:
              raise SystemExit('radar draw entry anchor not found')

          old_refresh = '''void radarDisplayRefreshAircraft() {
            initPalette();

            if (ensureFrameSprite()) {
          '''
          new_refresh = '''void radarDisplayRefreshAircraft() {
            initPalette();
            prepareMapForFrame();

            if (ensureFrameSprite()) {
          '''
          if old_refresh in text:
              text = text.replace(old_refresh, new_refresh)
          elif 'void radarDisplayRefreshAircraft()' in text and 'prepareMapForFrame();' not in text.split('void radarDisplayRefreshAircraft()',1)[1][:160]:
              raise SystemExit('radar refresh anchor not found')
          radar.write_text(text)

          clean_workflow = '''# Build firmware on push/PR; upload binaries as a short-lived artifact.
          name: Build

          on:
            push:
              branches: [main, master]
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: build-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            firmware:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Cache PlatformIO
                  uses: actions/cache@v4
                  with:
                    path: |
                      ~/.cache/pip
                      ~/.platformio/.cache
                      .pio/libdeps
                    key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
                    restore-keys: |
                      ${{ runner.os }}-pio-

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"

                - name: Install PlatformIO
                  run: pip install --upgrade platformio

                - name: Regenerate airport data
                  run: python3 scripts/build_large_airports.py

                - name: Build
                  run: pio run -e supermini

                - name: Merge web-flash image
                  run: pio run -t merge -e supermini

                - name: Upload firmware artifacts
                  uses: actions/upload-artifact@v4
                  with:
                    name: plane-radar-supermini
                    if-no-files-found: error
                    path: |
                      .pio/build/supermini/firmware-merged.bin
                      .pio/build/supermini/firmware.bin
                      .pio/build/supermini/bootloader.bin
                      .pio/build/supermini/partitions.bin
          '''
          Path('.github/workflows/build.yml').write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line
                        for line in clean_workflow.splitlines()) + '\n')
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add include/services/map_background.h src/services/map_background.cpp src/ui/radar_display.cpp .github/workflows/build.yml
            git commit -m "Separate map preparation from radar composition"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Regenerate airport data
        run: python3 scripts/build_large_airports.py

      - name: Build
        run: pio run -e supermini

      - name: Merge web-flash image
        run: pio run -t merge -e supermini

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plane-radar-supermini
          if-no-files-found: error
          path: |
            .pio/build/supermini/firmware-merged.bin
            .pio/build/supermini/firmware.bin
            .pio/build/supermini/bootloader.bin
            .pio/build/supermini/partitions.bin
